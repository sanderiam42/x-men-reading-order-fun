<title>X-Men Reading Tracker (Offline SPA)</title>

<style>
  :root { --fg:#111; --muted:#666; --line:#ddd; --bg:#fff; --readBg:#f6f6f6; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; margin: 24px; color: var(--fg); background: var(--bg); }
  h1 { margin: 0 0 12px; font-size: 1.3rem; }
  .toolbar { display:flex; gap:8px; margin: 0 0 16px; flex-wrap: wrap; }
  button, label.buttonlike { border:1px solid var(--line); background:#fafafa; padding:6px 10px; border-radius:8px; cursor:pointer; }
  input[type="file"] { display:none; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid var(--line); padding: 8px; vertical-align: top; }
  th { text-align: left; background: #f7f7f7; position: sticky; top: 0; }
  td.num { text-align: right; white-space: nowrap; width: 4ch; }
  td.cover img { max-width: 110px; height: auto; display: block; }
  tr.read { background: var(--readBg); color: var(--muted); }
  tr.read a { color: var(--muted); }
  .note { color: var(--muted); font-size:.9rem; margin-top:8px; }
  
  /* Custom checkbox styling */
  .custom-checkbox {
    position: relative;
    display: inline-block;
    width: 20px;
    height: 20px;
    background: #fff;
    border: 2px solid var(--line);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  
  .custom-checkbox:hover {
    border-color: #999;
    background: #f8f8f8;
  }
  
  .custom-checkbox.checked {
    background: #4CAF50;
    border-color: #4CAF50;
  }
  
  .custom-checkbox.checked::after {
    content: '✓';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 13px;
    font-weight: bold;
    line-height: 1;
  }

  .custom-checkbox input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    cursor: pointer;
    height: 0;
    width: 0;
  }
  
  /* IC (In Collection) row highlight */
  tr.in-collection { background: #EDFFF0; }

  /* IC checkbox styling */
  .ic-checkbox {
    position: relative;
    display: inline-block;
    width: 20px;
    height: 20px;
    background: #fff;
    border: 2px solid var(--line);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .ic-checkbox:hover { border-color: #999; background: #f8f8f8; }
  .ic-checkbox.checked {
    background: #EDFFF0;
    border-color: #6db87a;
  }
  .ic-checkbox.checked::after {
    content: '✓';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #4a8a55;
    font-size: 13px;
    font-weight: bold;
    line-height: 1;
  }
  .ic-checkbox input[type="checkbox"] {
    position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0;
  }
  .ic-checkbox.disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }

  /* Narrow checkbox columns so IC+Read share roughly the same space as Read alone */
  td.chk { width: 20px; padding: 6px 4px; text-align: center; }
  th.chk { padding: 8px 4px; text-align: center; }

  /* Make checked rows much darker and smaller */
  tr.read { background: #d0d0d0; color: #444; }
  tr.read a { color: #444; }

  /* Shrink checked row images to 30% size */
  tr.read .cover img { max-width: 33px; }

  /* Range start indicator */
  tr.range-start { background: #f0f8ff; }
  
  /* Tab bar */
  .tab-bar { display: flex; gap: 4px; border-bottom: 2px solid var(--line); padding: 8px 0 0; margin-bottom: 0; }
  .tab {
    padding: 7px 16px;
    border: 1px solid var(--line);
    border-bottom: none;
    background: #f0f0f0;
    cursor: pointer;
    border-radius: 6px 6px 0 0;
    font-size: 0.9rem;
    color: var(--muted);
    position: relative;
    bottom: -2px;
    white-space: nowrap;
  }
  .tab.active { background: var(--bg); color: var(--fg); font-weight: 600; border-bottom: 2px solid var(--bg); }
  .tab:hover:not(.active) { background: #e8e8e8; }

  /* Back-to-top button */
  #backToTopBtn {
    display: none;
    position: fixed;
    bottom: 24px;
    left: 24px;
    z-index: 100;
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--bg);
    color: var(--fg);
    font-size: 0.85rem;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  #backToTopBtn:hover { background: #f0f0f0; }

  /* Pin toolbar and table header to top */
  .toolbar { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 8px 0; margin: 0 0 0; }
  th { position: sticky; top: 52px; z-index: 9; }
</style>
</head>

  function migrateState() {
    if (localStorage.getItem(STORAGE_KEY)) return;
    const merged = { items: {} };
    for (const list of ALL_LISTS) {
      const old = JSON.parse(localStorage.getItem(`readingState:${list.listId}:v1`) || 'null');
      if (old?.items) Object.assign(merged.items, old.items);
    }
    if (Object.keys(merged.items).length > 0)
      localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
    for (const list of ALL_LISTS)
      localStorage.removeItem(`readingState:${list.listId}:v1`);
  }

  function loadState() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { items:{} }; }
    catch { return { items:{} }; }
  }
  function saveState(state) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  migrateState();
  const state = loadState();

  // ---- Tab state ----
  let activeListId = localStorage.getItem('activeTab') || ALL_LISTS[0].listId;
  if (!ALL_LISTS.find(l => l.listId === activeListId)) activeListId = ALL_LISTS[0].listId;

  // ---- Multi-select state ----
  let rangeStartCheckbox = null;
  let isRangeSelectionActive = false;

  // ---- Tab rendering ----
  function renderTabs() {
    const bar = document.getElementById('tabBar');
    bar.innerHTML = '';
    if (ALL_LISTS.length <= 1) { bar.style.display = 'none'; return; }
    bar.style.display = '';
    ALL_LISTS.forEach(list => {
      const btn = document.createElement('button');
      btn.className = 'tab' + (list.listId === activeListId ? ' active' : '');
      btn.textContent = list.label;
      btn.dataset.listId = list.listId;
      btn.addEventListener('click', () => switchTab(list.listId));
      bar.appendChild(btn);
    });
  }

  function switchTab(listId) {
    activeListId = listId;
    localStorage.setItem('activeTab', listId);
    renderTabs();
    renderList(listId);
  }

  // ---- List rendering ----
  const tbody = document.querySelector('#tbl tbody');

  function renderList(listId) {
    const list = ALL_LISTS.find(l => l.listId === listId);
    tbody.innerHTML = '';
    rangeStartCheckbox = null;
    isRangeSelectionActive = false;
    list.items.forEach((it, i) => tbody.appendChild(rowHtml(it, i)));
  }

  function rowHtml(it, index) {
    const checked = !!state.items[it.id]?.read;
    const icChecked = !!state.items[it.id]?.inCollection;
    const tr = document.createElement('tr');
    if (checked) tr.classList.add('read');
    if (icChecked && !checked) tr.classList.add('in-collection');

    // cells
    const tdNum = document.createElement('td'); tdNum.className = 'num'; tdNum.textContent = String(index+1);

    // IC (In Collection) checkbox
    const tdIc = document.createElement('td'); tdIc.className = 'chk';
    const icContainer = document.createElement('div');
    icContainer.className = 'ic-checkbox';
    if (icChecked) icContainer.classList.add('checked');
    if (checked) icContainer.classList.add('disabled');
    const icCb = document.createElement('input');
    icCb.type = 'checkbox';
    icCb.checked = icChecked;
    if (checked) icCb.disabled = true;
    icContainer.addEventListener('click', () => {
      if (icCb.disabled) return;
      icCb.checked = !icCb.checked;
      icContainer.classList.toggle('checked', icCb.checked);
      state.items[it.id] = state.items[it.id] || {};
      state.items[it.id].inCollection = icCb.checked;
      saveState(state);
      tr.classList.toggle('in-collection', icCb.checked);
    });
    icContainer.appendChild(icCb);
    tdIc.appendChild(icContainer);

    const tdChk = document.createElement('td'); tdChk.className = 'chk';
    const checkboxContainer = document.createElement('div');
    checkboxContainer.className = 'custom-checkbox';
    if (checked) checkboxContainer.classList.add('checked');

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = checked;

    const handleChange = () => {
      // Uncheck confirmation flow
      if (!cb.checked) {
        const label = buildIssueLabel(it);
        const ok = confirm(
`Unmark as unread?

${label}

This action is unusual. Do you want to proceed?`);
        if (!ok) { cb.checked = true; return; }
      }
      const now = Date.now();
      state.items[it.id] = state.items[it.id] || {};
      state.items[it.id].read = cb.checked;
      state.items[it.id].ts = now;
      saveState(state);
      tr.classList.toggle('read', cb.checked);
      checkboxContainer.classList.toggle('checked', cb.checked);
      if (cb.checked) {
        icCb.disabled = true;
        icContainer.classList.add('disabled');
        tr.classList.remove('in-collection');
      } else {
        icCb.disabled = false;
        icContainer.classList.remove('disabled');
        tr.classList.toggle('in-collection', !!state.items[it.id]?.inCollection);
      }
    };
    
    cb.addEventListener('change', handleChange);
    
    // Make the entire custom checkbox clickable with multi-select support
    checkboxContainer.addEventListener('click', (e) => {
      e.preventDefault();
      
      if (e.shiftKey) {
        if (!isRangeSelectionActive) {
          // First shift+click: start range selection (don't change state yet)
          rangeStartCheckbox = cb;
          isRangeSelectionActive = true;
          
          // Add visual indicator for range start
          tr.classList.add('range-start');
          return;
        } else if (rangeStartCheckbox && rangeStartCheckbox !== cb) {
          // Second shift+click: complete range selection
          const allRows = [...tbody.querySelectorAll('tr')];
          const startRow = allRows.find(row => row.querySelector('input[type="checkbox"]') === rangeStartCheckbox);
          const endRow = tr;
          
          if (startRow && endRow) {
            const startIndex = Math.min(allRows.indexOf(startRow), allRows.indexOf(endRow));
            const endIndex = Math.max(allRows.indexOf(startRow), allRows.indexOf(endRow));
            
            // Determine target state based on range start checkbox
            const targetState = !rangeStartCheckbox.checked;
            
            // Debug logging
            console.log('Multi-select debug:', {
              rangeStartChecked: rangeStartCheckbox.checked,
              targetState: targetState,
              willUncheck: targetState === false
            });
            
            // Check if any unchecking will happen
            const willUncheck = targetState === false;
            let uncheckItems = [];
            
            if (willUncheck) {
              // Collect items that will be unchecked for warning
              for (let i = startIndex; i <= endIndex; i++) {
                const row = allRows[i];
                const rowCb = row.querySelector('input[type="checkbox"]');
                if (rowCb && rowCb.checked) {
                  const itemId = row.dataset.itemId;
                  const item = items.find(item => item.id === itemId);
                  if (item) {
                    uncheckItems.push(buildIssueLabel(item));
                  }
                }
              }
            }
            
            // Show warning if unchecking multiple items
            if (willUncheck && uncheckItems.length > 1) {
              const ok = confirm(
`Unmark ${uncheckItems.length} comics as unread?

This will affect:
${uncheckItems.slice(0, 5).join('\n')}${uncheckItems.length > 5 ? '\n...and ' + (uncheckItems.length - 5) + ' more' : ''}

This action is unusual. Do you want to proceed?`);
              if (!ok) {
                // Reset range selection
                isRangeSelectionActive = false;
                rangeStartCheckbox = null;
                return;
              }
            }
            
            // Apply the change to all items in range
            for (let i = startIndex; i <= endIndex; i++) {
              const row = allRows[i];
              const rowCb = row.querySelector('input[type="checkbox"]');
              const rowContainer = row.querySelector('.custom-checkbox');
              if (rowCb && rowContainer) {
                rowCb.checked = targetState;
                row.classList.toggle('read', targetState);
                rowContainer.classList.toggle('checked', targetState);
                
                // Update state for each item
                const itemId = row.dataset.itemId;
                if (itemId) {
                  const now = Date.now();
                  state.items[itemId] = state.items[itemId] || {};
                  state.items[itemId].read = targetState;
                  state.items[itemId].ts = now;
                }
              }
            }
            
            // Save state after batch update
            saveState(state);
          }
          
          // Reset range selection
          isRangeSelectionActive = false;
          rangeStartCheckbox = null;
          
          // Remove visual indicator from all rows
          [...tbody.querySelectorAll('tr.range-start')].forEach(row => {
            row.classList.remove('range-start');
          });
        }
      } else {
        // Single checkbox toggle (no shift)
        if (cb.checked) {
          // Unchecking: show warning immediately
          const label = buildIssueLabel(it);
          const ok = confirm(
`Unmark as unread?

${label}

This action is unusual. Do you want to proceed?`);
          if (!ok) return;
        }
        
        // Apply the change
        cb.checked = !cb.checked;
        handleChange();
        
        // Reset range selection if not using shift
        isRangeSelectionActive = false;
        rangeStartCheckbox = null;
        
        // Remove visual indicator from all rows
        [...tbody.querySelectorAll('tr.range-start')].forEach(row => {
          row.classList.remove('range-start');
        });
      }
    });
    
    checkboxContainer.appendChild(cb);
    tdChk.appendChild(checkboxContainer);

    const tdCover = document.createElement('td'); tdCover.className = 'cover';
    if (it.img) {
      const img = document.createElement('img');
      img.src = it.img; img.alt = (it.title || 'cover');
      tdCover.appendChild(img);
    }

    const tdTitle = document.createElement('td');
    tdTitle.innerHTML = `<strong>${esc(it.title || '')}</strong>` +
      (it.series && it.issue ? `<div class="note">${esc(it.series)} #${esc(it.issue)}</div>` : '');

    const tdPub = document.createElement('td'); tdPub.textContent = it.publisher || '';
    const tdDate = document.createElement('td'); tdDate.textContent = it.date || '';

    const tdLink = document.createElement('td');
    if (it.href) {
      const a = document.createElement('a'); a.href = it.href; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.textContent = 'Issue';
      tdLink.appendChild(a);
    }

    tr.append(tdNum, tdIc, tdChk, tdCover, tdTitle, tdPub, tdDate, tdLink);
    tr.dataset.itemId = it.id;
    return tr;
  }

  renderTabs();
  renderList(activeListId);

  // ---- Back-to-top button (only when 2+ tabs exist) ----
  if (ALL_LISTS.length > 1) {
    const backBtn = document.getElementById('backToTopBtn');
    backBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    new IntersectionObserver(
      ([entry]) => { backBtn.style.display = entry.isIntersecting ? 'none' : 'block'; },
      { threshold: 0 }
    ).observe(document.getElementById('tabBar'));
  }

  // ---- Toolbar actions ----
  document.getElementById('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement('a'), { href: url, download: 'x-men-reading-state.json' });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  });

  document.getElementById('importFile').addEventListener('change', async (e) => {
    const file = e.target.files?.[0]; if (!file) return;
    try {
      const text = await file.text();
      const incoming = JSON.parse(text);
      if (!incoming || typeof incoming !== 'object' || !incoming.items) throw new Error('Invalid state file.');
      state.items = { ...state.items, ...incoming.items };
      saveState(state);
      renderList(activeListId);
      alert('State imported.');
    } catch (err) {
      alert('Failed to import: ' + (err?.message || err));
    } finally {
      e.target.value = '';
    }
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    const ok = confirm('This will clear read progress for ALL tabs. Continue?');
    if (!ok) return;
    localStorage.removeItem(STORAGE_KEY);
    Object.keys(state.items).forEach(k => delete state.items[k]);
    renderList(activeListId);
  });

  document.getElementById('skipToNextBtn').addEventListener('click', () => {
    const firstUnreadRow = [...tbody.querySelectorAll('tr')].find(tr => !tr.classList.contains('read'));
    if (firstUnreadRow) {
      firstUnreadRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
      firstUnreadRow.style.backgroundColor = '#fff3cd';
      setTimeout(() => { firstUnreadRow.style.backgroundColor = ''; }, 2000);
    } else {
      alert('All comics in this tab are marked as read!');
    }
  });

  // ---- Utils ----
  function esc(s='') {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function buildIssueLabel(it) {
    const parts = [];
    if (it.series) parts.push(it.series);
    if (it.issue) parts.push(`#${it.issue}`);
    const label = parts.length ? parts.join(' ') : (it.title || 'This comic');
    const meta = [];
    if (it.publisher) meta.push(it.publisher);
    if (it.date) meta.push(it.date);
    return meta.length ? `${label} — ${meta.join(' • ')}` : label;
  }
})();
</script>
</body>
</html>
